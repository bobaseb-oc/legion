# Legion for iOS: `xcodegen` makes Legion.xcodeproj (and the
# Info.plist and entitlements below) from this file; ios.sh builds it.
# The team signing it is no setting here: ios.sh gives it (TEAM_ID).

name: Legion
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  Legion:
    type: application
    platform: iOS
    scheme: {}
    sources: [App, Shared]
    dependencies:
      - target: Share
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oncorps.legion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Legion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LegionSite: $(LEGION_SITE)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Dictate your messages to Legion.
        NSCameraUsageDescription: Take a photo to send in your chat.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/App.entitlements
      properties:
        aps-environment: development
        # no associated domain: Legion has none of its own (upstream's was
        # uniichat.com), so sign-in links open in the browser, not the app
        com.apple.security.application-groups: [group.com.oncorps.legion]
        # the sign-in's Keychain item, shared with the extension (Site.swift)
        # RED ZONE (security review SE, DRAFT awaiting the user's sign-off)
        keychain-access-groups: [$(AppIdentifierPrefix)com.oncorps.legion]
  Share:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oncorps.legion.share
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Legion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LegionSite: $(LEGION_SITE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Share
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.oncorps.legion]
        # the sign-in's Keychain item, shared with the extension (Site.swift)
        # RED ZONE (security review SE, DRAFT awaiting the user's sign-off)
        keychain-access-groups: [$(AppIdentifierPrefix)com.oncorps.legion]
